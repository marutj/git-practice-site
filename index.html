<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A small website for learning Git and GitHub Pages.">
    <title>BROKEN !!! - Git Practice Site</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Version 1.0</p>
      <h1>My Git practice website</h1>
      <p>
        This site is intentionally small: edit it, commit it, publish it, and
        safely undo a change to learn the Git workflow.
      </p>

      <div class="actions">
        <button id="test-button" type="button">Test the JavaScript</button>
        <span id="message" role="status" aria-live="polite"></span>
      </div>

      <section>
        <h2>The workflow</h2>
        <ol>
          <li>Make a small change.</li>
          <li>Review and commit it.</li>
          <li>Push it to GitHub.</li>
          <li>Revert it if it causes a problem.</li>
        </ol>
      </section>
    </main>
  </body>
</html>
